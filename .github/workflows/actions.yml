name: CI

on:
  - pull_request

jobs:
  job1:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Vérifier les fichiers présents
        run: ls -la

      - name: Build and test
        run: |
          cd book
          ./gradlew build

      - name: Docker images
        run: |
          cd book
          docker build -t book .
          docker images