# Deployment de devsecops
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentalservice1
  labels:
    app: rentalservice1
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rentalservice1
  template:
    metadata:
      labels:
        app: rentalservice1
    spec:
      containers:
        - name: rentalservice1
          image: theo18/book:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
      restartPolicy: Always
---
# Service Kubernetes
apiVersion: v1
kind: Service
metadata:
  name: rentalservice1
  labels:
    app: rentalservice1
spec:
  type: LoadBalancer
  selector:
    app: rentalservice1
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
# Gateway Istio
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: microservice-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
# VirtualService Istio
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: devsecops
spec:
  hosts:
    - "*"
  gateways:
    - microservice-gateway
  http:
    - match:
        - uri:
            prefix: /rentalservice1/
      rewrite:
        uri: /
      route:
        - destination:
            host: rentalservice1.default.svc.cluster.local
            port:
              number: 80
